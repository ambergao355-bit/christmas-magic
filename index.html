<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020705"><meta name="description" content="A little Christmas magic for Max, with love from Amber.">
<title>Merry Christmas Max, by Amber</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020504;color:#fff4d5}body{font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;left:7%;top:19%;pointer-events:none;z-index:1;max-width:43%}h1{margin:0;font:italic 400 clamp(28px,4vw,64px)/1.25 'Snell Roundhand','Apple Chancery','Brush Script MT',Georgia,cursive;letter-spacing:-.035em;color:#ffe9b8;text-shadow:0 0 15px #d7803870,0 0 35px #8b642350}header p{margin:14px 0 0;font:italic 400 clamp(22px,2.4vw,38px)/1.2 'Snell Roundhand','Apple Chancery',Georgia,cursive;color:#c6e4b9;text-shadow:0 0 15px #5ca86d70}.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:26px;display:flex;gap:10px}button{border:1px solid #dec28b45;border-radius:30px;background:#08100eb0;color:#e9d7b6;padding:11px 18px;font:14px system-ui;cursor:pointer;backdrop-filter:blur(10px)}button:hover{background:#233027}button:focus-visible{outline:2px solid #f8b65c;outline-offset:4px}.hint{position:absolute;bottom:30px;left:7%;font:12px system-ui;letter-spacing:.08em;color:#c2cfbf80;pointer-events:none}#fallback{display:none;position:absolute;bottom:20%;left:10%;right:10%;text-align:center;font:18px/1.5 Georgia}
@media(max-width:650px){header{top:7%;left:6%;right:6%;text-align:center;max-width:none}h1{font-size:clamp(27px,7.2vw,44px)}header p{font-size:25px;margin-top:8px}.hint{display:none}.controls{right:6%}button{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="An animated green Christmas tree wrapped in red ribbons, sparkling orange lights, a golden star, and falling snow."></canvas>
<header><h1>Merry Christmas Max,</h1><p>by Amber</p></header>
<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
<div class="controls"><button id="motion" type="button" aria-pressed="false">Pause</button><button id="reset" type="button">Reset</button></div>
<p id="fallback">Merry Christmas, Max. Wishing you a season full of warmth and wonder.<br>by Amber<br><small>Your browser could not start the animated scene. Try opening this page in Safari, Chrome, or Edge.</small></p>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('scene'), gl=canvas.getContext('webgl',{alpha:false,antialias:false,powerPreference:'low-power'});
if(!gl){document.getElementById('fallback').style.display='block';document.querySelector('.controls').hidden=true;return;}
const vs=`precision mediump float;attribute vec3 aPos;attribute vec3 aCol;attribute float aSize;attribute float aKind;attribute float aPhase;
uniform float uTime,uYaw,uPitch,uDistance,uAspect,uScale,uMobile;varying vec3 vCol;varying float vKind;varying float vPhase;
void main(){vec3 p=aPos;float k=aKind;if(k==5.){p.z=mod(p.z-uTime*(.38+aPhase*.05)+8.,20.)-3.;p.x+=sin(uTime*.3+aPhase)*.35;}
float ang=uYaw+uTime*(k==0.? .008:.035);float c=cos(ang),s=sin(ang);vec2 xy=mat2(c,-s,s,c)*p.xy;p.xy=xy;
float z=p.z-4.1;float depth=uDistance+p.y*cos(uPitch)-z*sin(uPitch);float y=p.y*sin(uPitch)+z*cos(uPitch);
float f=2.35;gl_Position=vec4(p.x*f/uAspect,y*f-uMobile*depth*.14,depth*.01,depth);
gl_PointSize=clamp(aSize*uScale/depth,1.,k==9.?160.:36.);
vCol=aCol;vKind=k;vPhase=aPhase;}`;
const fs=`precision mediump float;varying vec3 vCol;varying float vKind;varying float vPhase;uniform float uTime;
float star(vec2 p){vec2 a=vec2(0.,.82);float inside=0.;float md=10.;for(int i=1;i<=10;i++){float t=float(i)*.62831853;float r=mod(float(i),2.)<.5?.82:.36;vec2 b=vec2(sin(t),cos(t))*r;vec2 e=b-a;vec2 w=p-a;md=min(md,length(w-e*clamp(dot(w,e)/dot(e,e),0.,1.)));if((a.y>p.y)!=(b.y>p.y)){float x=a.x+(p.y-a.y)*(b.x-a.x)/(b.y-a.y);if(p.x<x)inside=1.-inside;}a=b;}return inside>.5?-md:md;}
void main(){vec2 p=gl_PointCoord*2.-1.;float r=dot(p,p);if(r>1.)discard;float k=vKind;float pulse=.85+.15*sin(uTime*1.7+vPhase*7.);vec3 col=vCol;float light;
if(k==9.){float d=star(vec2(p.x,-p.y)*1.25);float body=1.-smoothstep(-.015,.015,d);float halo=exp(-max(d,0.)*8.)*.24;col=mix(vec3(1.,.32,.025),vec3(1.,.91,.55),exp(-r*9.));light=body+halo;}
else{light=exp(-r*(k==4.?10.:15.))+.035*exp(-r*3.);if(k==3.){light=exp(-r*10.)+.08*exp(-r*2.5);col+=vec3(.3,.12,.01)*exp(-r*40.);}if(k==4.)light+=.12*(exp(-abs(p.x)*28.)*exp(-abs(p.y)*3.)+exp(-abs(p.y)*28.)*exp(-abs(p.x)*3.));}
gl_FragColor=vec4(col*light*pulse,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
try{
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
let seed=2026;function rand(){seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296;}const mix=(a,b)=>a+(b-a)*rand();const points=[];
function add(x,y,z,col,size,kind){points.push(x,y,z,...col,size,kind,rand()*6.283);}
function helix(t){const a=2*Math.PI*4.85*t+.35,r=3.72*Math.pow(1-t,.9);return[r*Math.cos(a),r*Math.sin(a),.88+8.62*t];}
// Emerald tree volume, independent of the red spiral ribbon.
for(let i=0;i<19000;i++){let t=Math.pow(rand(),1.2)*.97,r=3.72*Math.pow(1-t,.9)*Math.sqrt(rand()),a=rand()*6.283;add(r*Math.cos(a),r*Math.sin(a),.88+8.62*t,[mix(.035,.10),mix(.80,1.65),mix(.12,.35)],mix(.045,.10),1);}
// Ruby-red ribbons, bright fine threads and a soft trailing edge.
for(let i=0;i<22000;i++){let t=rand(),p=helix(t),a=2*Math.PI*4.85*t+.35,w=(rand()-.5)*.65*Math.sqrt(1-t),r=Math.hypot(p[0],p[1])-w*.4;add(r*Math.cos(a),r*Math.sin(a),p[2]+w,[mix(.72,1.35),mix(.012,.055),mix(.025,.075)],mix(.045,.1),2);}
for(let i=0;i<5000;i++){let t=rand()*.94,p=helix(t);add(p[0]+mix(-.12,.12),p[1]+mix(-.12,.12),p[2]-mix(.08,.55),[mix(.3,.65),.015,.035],mix(.03,.075),2);}
// Warm orange ornaments and flares.
for(let i=0;i<730;i++){let t=rand()*.93,r=3.72*Math.pow(1-t,.9)*Math.sqrt(mix(.15,1)),a=rand()*6.283;add(r*Math.cos(a),r*Math.sin(a),.88+8.62*t,[mix(1.3,2.),mix(.35,.72),mix(.025,.09)],mix(.12,.30),i%5?3:4);}
// A wide, feathered galaxy floor with broken orbital rings.
for(let i=0;i<24000;i++){let ring=Math.floor(rand()*12),base=2+ring*1.12,a=rand()*6.283,r=i%3?base+mix(-.18,.18):Math.sqrt(mix(5,260)),fade=Math.max(.08,1-Math.pow(r/18,3)),v=mix(.55,1.65)*fade;add(r*Math.cos(a),r*Math.sin(a),mix(-.03,.06),[v,v*mix(.4,.7),v*.13],mix(.035,.105),0);}
for(let i=0;i<750;i++){let a=rand()*6.283,r=Math.sqrt(mix(9,260));add(r*Math.cos(a),r*Math.sin(a),.08,[1.1,.55,.12],mix(.09,.18),4);}
// Floating stars and falling snow.
for(let i=0;i<1500;i++){add(mix(-32,32),mix(-15,28),mix(-4,28),[mix(.5,1.1),mix(.35,.7),mix(.15,.38)],mix(.06,.15),5);}
add(0,0,9.93,[1.,.65,.15],2.5,9);
const data=new Float32Array(points);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
for(const [name,n,offset]of[['aPos',3,0],['aCol',3,3],['aSize',1,6],['aKind',1,7],['aPhase',1,8]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,n,gl.FLOAT,false,9*4,offset*4);}
const uniforms={};for(const n of['uTime','uYaw','uPitch','uDistance','uAspect','uScale','uMobile'])uniforms[n]=gl.getUniformLocation(program,n);
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.clearColor(.002,.008,.005,1);
let yaw=0,pitch=.43,distance=23,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,drag=null;
const button=document.getElementById('motion');function syncButton(){button.textContent=paused?'Play':'Pause';button.setAttribute('aria-pressed',String(paused));}syncButton();button.onclick=()=>{paused=!paused;syncButton();};document.getElementById('reset').onclick=()=>{yaw=0;pitch=.43;distance=23;};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.006;pitch=Math.min(1.05,Math.max(-.05,pitch+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY];};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.min(34,Math.max(16,distance+e.deltaY*.012));},{passive:false});
function frame(now){const dt=last?Math.min((now-last)/1000,.08):0;last=now;if(!paused)time+=dt;const mobile=innerWidth<650,dpr=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(uniforms.uTime,time);gl.uniform1f(uniforms.uYaw,yaw);gl.uniform1f(uniforms.uPitch,pitch);gl.uniform1f(uniforms.uDistance,mobile?distance+13:distance);gl.uniform1f(uniforms.uAspect,w/h);gl.uniform1f(uniforms.uScale,h*1.17);gl.uniform1f(uniforms.uMobile,mobile?1:0);gl.drawArrays(gl.POINTS,0,data.length/9);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();document.getElementById('fallback').style.display='block';});
}catch(error){console.error(error);document.getElementById('fallback').style.display='block';}
})();
</script>
</body>
</html>
