<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030906"><meta name="description" content="An interactive Christmas greeting with a tree, wreath, spiral and star.">
<title>Merry Christmas · Interactive Shapes</title>
<link rel="stylesheet" href="magic.css">
</head>
<body>
<canvas id="scene" aria-label="An interactive green Christmas tree that transforms into a wreath, spiral tree, or golden star."></canvas>
<div class="vignette" aria-hidden="true"></div>
<nav class="topbar"><a href="./" aria-label="Back to the original Christmas tree">✦ <span></span></a><button id="camera" class="camera-button" aria-pressed="false">Enable gestures</button></nav>
<header class="intro"><h1>Merry Christmas</h1></header>

<aside id="camera-panel" hidden><video id="webcam" autoplay playsinline muted></video><canvas id="hand-overlay"></canvas><p id="hand-status" role="status">Preparing hand tracking…</p><button id="stop-camera" aria-label="Stop camera">×</button></aside>
<div class="bottom"><p class="scene-caption" id="scene-caption" hidden></p><div class="mode-bar" role="group" aria-label="Christmas shapes"><button id="tree" class="active" aria-pressed="true">Tree</button><button id="wreath" aria-pressed="false">Wreath</button><button id="spiral" aria-pressed="false">Spiral</button><button id="star" aria-pressed="false">Star</button><button id="motion" aria-pressed="false" aria-label="Pause animation">Ⅱ</button></div><p class="help">DRAG TO ROTATE · SCROLL TO ZOOM · CHOOSE A SHAPE</p></div>
<div id="notice" role="status" aria-live="polite"></div>
<p id="fallback" hidden>Your browser could not start the 3D scene. Try opening this page in Safari, Chrome, or Edge.<br>Merry Christmas</p>
<script type="module" src="magic.js"></script>
</body></html>
